# H2 内嵌数据库
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:D:/CODE/Bfireworks/data/bfireworks;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
